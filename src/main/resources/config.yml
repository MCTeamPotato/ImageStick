# ImageStick Configuration

# The port the built-in HTTP file server will listen on.
# Make sure this port is open in your firewall.
http-port: 8765

# The IP address used to build image URLs.
# Set this to your server's PUBLIC IP.
# Leave as "auto" to attempt automatic detection (may not work behind NAT).
server-ip: "auto"

# Delay (in ticks) between each /imageframe create command dispatch.
# 20 ticks = 1 second. Increase if ImageFrame needs more time between imports.
command-delay-ticks: 5
